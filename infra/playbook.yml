- name: Set up the Raspberry Pi to run dgadetect
  hosts: pi
  become: true
  vars:
    tailscale_hostname: devops-project
    github_repo: vilhelmprytz/devops-project
  vars_prompt:
    - name: tailscale_authkey
      prompt: Tailscale auth key (leave empty if the Pi is already on the tailnet)
      private: true
      default: ""

  tasks:
    - name: Install Docker, curl and python3-debian
      ansible.builtin.apt:
        name: [docker.io, curl, python3-debian]
        update_cache: true

    - name: Add the Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        update_cache: true

    - name: Check whether the Pi is on the tailnet
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join the tailnet
      when: (tailscale_status.stdout | from_json).BackendState != "Running"
      block:
        - name: Require an auth key
          ansible.builtin.assert:
            that: tailscale_authkey | length > 0
            fail_msg: The Pi is not on the tailnet yet. Rerun and enter a Tailscale auth key.

        - name: Run tailscale up
          ansible.builtin.command: >-
            tailscale up --auth-key={{ tailscale_authkey }} --timeout=60s
            --hostname={{ tailscale_hostname }}
          no_log: true
          changed_when: true

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true
        shell: /bin/bash

    - name: Create the deploy user's .ssh directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Let CI's deploy key run only the deploy script
      ansible.builtin.copy:
        content: |
          restrict,command="/usr/local/bin/dgadetect-deploy \"$SSH_ORIGINAL_COMMAND\"" {{ lookup('file', 'deploy_key.pub') }}
        dest: /home/deploy/.ssh/authorized_keys
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Install the deploy script
      ansible.builtin.copy:
        src: dgadetect-deploy.sh
        dest: /usr/local/bin/dgadetect-deploy
        mode: "0755"

    - name: Find the latest release
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_repo }}/releases/latest"
      register: latest_release

    - name: Deploy the latest release
      ansible.builtin.command: "dgadetect-deploy {{ latest_release.json.tag_name | regex_replace('^v', '') }}"
      become: true
      become_user: deploy
      register: deploy
      changed_when: "'already running' not in deploy.stdout"
