# Everything that defines a model. A change here is a model change.

[data]
families = ["necurs", "qakbot", "pushdo", "suppobox"]
train_dates = [2024-01-01, 2024-12-31]   # DGA domains for these dates -> train
test_dates = [2025-01-01, 2025-06-30]    # ... and these -> test
dga_train_count = 8000                   # per family
dga_test_count = 2000                    # per family
benign_test_fraction = 0.2
random_seed = 1337

[data.tranco]
list_id = "K9QPW"        # Tranco list of 2026-09-01
size = 100000
sha256 = "d35a0d260c030d0c3831db855438b843b8ddd6f7ed77e1dab0f1194e675578d4"

[model]
ngram_max = 4            # character n-grams of length 1..4
n_features = 262144      # 2**18 hashed n-gram buckets
C = 10.0
decision_threshold = 0.9

[gate]
max_fpr = 0.01
regression_tolerance = 0.001   # absolute; for FPR and every family's FNR (about 2 test domains per family)

[gate.max_fnr]
necurs = 0.20
qakbot = 0.15
pushdo = 0.10
suppobox = 0.55
